name: Docker Build CI

on: [push, pull_request]

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway Docker Image
        run: docker build -t walawe-gateway -f apps/gateway/Dockerfile .

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web Docker Image
        run: docker build -t walawe-web -f apps/web/Dockerfile ./apps/web

name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          pip install yamllint
          yamllint .github/workflows/ci.yml || true
      - name: Check no secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
      
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - name: Go fmt check
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed"; exit 1)
      - name: Test Gateway
        run: cd apps/gateway && go test ./...
      - name: Test Ledger
        run: cd packages/ledger && go test ./...
      - name: Test Policy Engine
        run: cd packages/policy-engine && go test ./...
      - name: Test Providers
        run: cd packages/providers && go test ./...

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.dev.yml config --quiet

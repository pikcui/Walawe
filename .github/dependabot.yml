version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/apps/gateway"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "github.com/jackc/pgx/v5" # Hindari update yang butuh Go 1.25
  - package-ecosystem: "gomod"
    directory: "/packages/ledger"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "github.com/jackc/pgx/v5"
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

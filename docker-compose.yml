version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: walawe
      POSTGRES_PASSWORD: walawe_secret
      POSTGRES_DB: walawe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Ini akan otomatis menjalankan file migrasi kita saat pertama kali nyala
      - ./migrations:/docker-entrypoint-initdb.d 

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://walawe:walawe_secret@db:5432/walawe?sslmode=disable
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - gateway

volumes:
  pgdata:
